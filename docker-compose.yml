# Usage:
#   cp .env.example .env && chmod 600 .env   # then set POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec goftp goftp user add alice --role superadmin

# Docker keeps all of a container's log unless told otherwise, and goftp
# logs every request: each keeps its last 50 MB, so that requests cannot
# fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: goftp
      POSTGRES_USER: goftp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "goftp", "-d", "goftp"]
      interval: 5s
      timeout: 5s
      retries: 10

  goftp:
    build: .
    image: goftp
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOFTP_DATABASE_URL: postgres://goftp@postgres:5432/goftp?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GOFTP_UPLOAD_MAX_SIZE: ${GOFTP_UPLOAD_MAX_SIZE:-0}
      GOFTP_UPLOAD_MIN_FREE: ${GOFTP_UPLOAD_MIN_FREE:-1GiB}
      GOFTP_HOMES_QUOTA: ${GOFTP_HOMES_QUOTA:-0}
      GOFTP_SERVER_MAX_CONNS_PER_IP: ${GOFTP_MAX_CONNS_PER_IP:-0}
      GOFTP_SERVER_PROXY_HEADER: ${GOFTP_PROXY_HEADER:-}
      GOFTP_SERVER_TRUSTED_PROXIES: ${GOFTP_TRUSTED_PROXIES:-}
      GOFTP_TLS_CERT_FILE: ${GOFTP_TLS_CERT:+/tls/${GOFTP_TLS_CERT}}
      GOFTP_TLS_KEY_FILE: ${GOFTP_TLS_KEY:+/tls/${GOFTP_TLS_KEY}}
    ports:
      - "${GOFTP_BIND:-127.0.0.1}:${GOFTP_PORT:-8080}:8080"
    user: "${GOFTP_RUN_AS:-65532:65532}"
    volumes:
      - ${GOFTP_DATA:-files}:/data
      - ${GOFTP_TLS_DIR:-tls}:/tls:ro
      - cache:/cache   # thumbnails
    # Longer than server.shutdown_timeout, so uploads can finish.
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  files:
  tls:
  cache:
