name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories turn up without any change here.
  schedule:
    - cron: "17 5 * * 1"
  # Run on main, it tests and deploys again.
  workflow_dispatch:

permissions:
  contents: read

# Runs on main wait for each other instead of cutting off a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: goftp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GOFTP_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/goftp_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build for other systems
        run: |
          for os in windows darwin freebsd; do
            GOOS=$os go build ./...
          done

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Builds the image for amd64 and arm64. For pushes to main, and runs
  # started by hand on main, it is published as ghcr.io/OWNER/REPO, tagged
  # latest and sha-COMMIT; the deploy job deploys that image.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose file
        run: POSTGRES_PASSWORD=ci docker compose config --quiet
      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Image
        id: image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          description="Resumable file server with users, roles and share links"
          # Docker's default builder cannot build several platforms at once.
          # Its image is pinned: it builds and pushes what gets deployed.
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea >/dev/null
          docker buildx build --pull --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.title=goftp \
            --label "org.opencontainers.image.description=$description" \
            --label "org.opencontainers.image.source=$source" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.description=$description" \
            --annotation "index:org.opencontainers.image.source=$source" \
            --tag "$image:latest" --tag "$image:sha-${GITHUB_SHA::7}" \
            --output "type=image,push=$PUBLISH" \
            --metadata-file "$RUNNER_TEMP/image.json" .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")" >> "$GITHUB_OUTPUT"
      - name: Log out of ghcr.io
        if: always() && env.PUBLISH == 'true'
        run: docker logout ghcr.io

  # Tells the server, over SSH, the digest of the image the docker job
  # published, for every push to main that passes. The server's key runs
  # only deploy/deploy.sh there, which pulls that image and starts it. See
  # "Deploying" in the README for the settings of the production environment.
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Settings
        id: settings
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::Not deployed: the production environment needs the secrets DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see Deploying in the README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: SSH
        if: steps.settings.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 15
          EOF
      # Whatever command is sent, the server's key runs deploy.sh, which
      # takes the command as the digest to deploy.
      - name: Deploy
        if: steps.settings.outputs.ready == 'true'
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          case $DIGEST in
            sha256:*) ;;
            *) echo "::error::The docker job published no image (digest: '$DIGEST')"; exit 1 ;;
          esac
          ssh server "$DIGEST" < /dev/null
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
