# Every key can also be set via environment (GOFTP_ prefix, "." -> "_",
# e.g. GOFTP_LOG_LEVEL=debug). Flags (--dir, --addr) win over both.

dir: /srv/files          # directory to serve
addr: ":8080"            # listen address (IPv4 and IPv6)

database:
  # Prefer GOFTP_DATABASE_URL, or keep the password out of the URL with
  # PGPASSWORD. If set here, keep this file private (chmod 600).
  url: postgres://goftp@localhost:5432/goftp

auth:
  session_ttl: 12h       # how long a sign-in lasts

log:
  level: info            # debug, info, warn, error
  format: json           # json or console

server:
  read_timeout: 10s      # time allowed to read a request (units required)
  write_timeout: 1m      # max time without write progress during a response
  idle_timeout: 2m       # keep-alive idle time
  shutdown_timeout: 10s  # grace period for in-flight requests on shutdown
  # Behind a reverse proxy: the header with the client address, and the
  # proxy addresses. X-Forwarded-For suits common proxies, which append to
  # it (nginx: proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;),
  # so clients cannot forge it. The proxy should also set X-Forwarded-Proto,
  # so HTTPS is recognized; HSTS is sent then.
  proxy_header: ""
  trusted_proxies: []    # e.g. ["127.0.0.1", "10.0.0.0/8"]
  # Connections one client may hold at once (IPv6 clients: per /64), e.g.
  # 100 when clients connect directly; behind a proxy, limit them there.
  max_conns_per_ip: 0    # 0 = no limit

tls:                     # serve HTTPS directly
  cert_file: ""
  key_file: ""

limiter:                 # per-client budget of failed password checks
  max_failures: 20       # 0 disables
  window: 1m

upload:
  max_size: 0            # per file, e.g. 10GiB; 0 = unlimited
  min_free: 1GiB         # uploads stop short of this much free disk; 0 = no check
  resume_window: 24h     # how long an interrupted upload can be resumed

homes:                   # a private folder for every user, as PATH/NAME
  path: /home            # off turns them off
  quota: 0               # how much a home may hold, e.g. 10GiB, unless set for its user; 0 = no limit

trash:                   # deleted files and folders, which can be restored
  keep: 720h             # how long (30 days); 0 deletes at once

cache:                   # thumbnails of images
  dir: ""                # default: goftp in the user's cache directory; not in dir
  max_size: 512MiB       # 0 disables the cache
